services:
  postgres:
    image: postgres:18
    container_name: popisomator-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popisomator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popisomator}
      POSTGRES_DB: ${POSTGRES_DB:-popisomator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    tty: true

volumes:
  postgres_data:
