services:
  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popisomator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popisomator}
      POSTGRES_DB: ${POSTGRES_DB:-popisomator}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    tty: true

  migrate:
    build:
      context: ./backend
      target: migrations
    command:
      [
        "migrate",
        "apply",
        "--dir",
        "file:///migrations",
        "--url",
        "postgres://${POSTGRES_USER:-popisomator}:${POSTGRES_PASSWORD:-popisomator}@postgres:5432/${POSTGRES_DB:-popisomator}?sslmode=disable",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      POPISOMATOR_POSTGRES_DSN: "postgres://${POSTGRES_USER:-popisomator}:${POSTGRES_PASSWORD:-popisomator}@postgres:5432/${POSTGRES_DB:-popisomator}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:5173}

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      CADDY_SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "${CADDY_HTTP_PORT:-5173}:80"
      - "${CADDY_HTTPS_PORT:-4433}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
