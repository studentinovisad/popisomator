services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popisomator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popisomator}
      POSTGRES_DB: ${POSTGRES_DB:-popisomator}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrations
    command:
      [
        "migrate",
        "apply",
        "--dir",
        "file:///migrations",
        "--url",
        "postgres://${POSTGRES_USER:-popisomator}:${POSTGRES_PASSWORD:-popisomator}@postgres:5432/${POSTGRES_DB:-popisomator}?sslmode=disable",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      POPISOMATOR_BACKEND_ADDR: :8080
      POPISOMATOR_POSTGRES_DSN: "postgres://${POSTGRES_USER:-popisomator}:${POSTGRES_PASSWORD:-popisomator}@postgres:5432/${POSTGRES_DB:-popisomator}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      ORIGIN: http://localhost:5173

  caddy:
    image: docker.io/library/caddy:2-alpine
    ports:
      - "5173:80"
    volumes:
      - ./deploy/Caddyfile.demo:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      - backend
      - frontend

volumes:
  demo_postgres_data:
