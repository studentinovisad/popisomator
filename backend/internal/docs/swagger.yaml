basePath: /
definitions:
  github_com_studentinovisad_popisomator_backend_internal_dto.AddUpdateItemPropertyRequest:
    properties:
      item_id:
        type: integer
      property_id:
        type: integer
      value:
        items:
          type: integer
        type: array
    required:
    - item_id
    - property_id
    - value
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.AddUpdateItemTypePropertyRequest:
    properties:
      default_value:
        items:
          type: integer
        type: array
      property_id:
        type: integer
      type_id:
        type: integer
      visibility:
        allOf:
        - $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_repository.PropertyVisibility'
        enum:
        - overview
        - details
    required:
    - property_id
    - type_id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.CreateItemRequest:
    properties:
      amount:
        maximum: 100
        type: integer
      properties:
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemProperty'
        type: array
      type_id:
        type: integer
    required:
    - amount
    - type_id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.CreateItemTypeRequest:
    properties:
      derived_name_format:
        maxLength: 255
        type: string
      description:
        type: string
      name:
        type: string
      properties:
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemTypeProperty'
        type: array
    required:
    - derived_name_format
    - name
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.CreatePropertyRequest:
    properties:
      default_value:
        items:
          type: integer
        type: array
      description:
        type: string
      name:
        type: string
      value_type:
        enum:
        - string
        - number
        - boolean
        - price
        - expiry
        - mass
        - volume
        type: string
    required:
    - name
    - value_type
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - manager
        - user
        type: string
      status:
        enum:
        - requested
        - active
        type: string
    required:
    - email
    - full_name
    - password
    - role
    - status
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.Item:
    properties:
      consumption:
        $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_repository.ConsumptionStatus'
      derived_name:
        type: string
      id:
        type: integer
      properties:
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemProperty'
        type: array
      request_status:
        $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_repository.RequestStatus'
      type_id:
        type: integer
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemProperty:
    properties:
      id:
        type: integer
      smart_data:
        type: string
      value:
        items:
          type: integer
        type: array
      value_type:
        type: string
      visibility:
        type: string
    required:
    - id
    - value
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequest:
    properties:
      created_at:
        type: string
      item_id:
        type: integer
      item_name:
        type: string
      reason:
        type: string
      status:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestCreatePersonalRequest:
    properties:
      item_id:
        type: integer
      reason:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestCreateRequest:
    properties:
      item_id:
        type: integer
      reason:
        maxLength: 400
        type: string
      user_id:
        type: integer
    required:
    - item_id
    - user_id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestIdentifierRequest:
    properties:
      item_id:
        type: integer
      user_id:
        type: integer
    required:
    - item_id
    - user_id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestPreparationItem:
    properties:
      consumption:
        $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_repository.ConsumptionStatus'
      derived_name_format:
        type: string
      id:
        type: integer
      name:
        type: string
      properties:
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestPreparationProperty'
        type: array
      reason:
        type: string
      requested_at:
        type: string
      type_name:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestPreparationProperty:
    properties:
      name:
        type: string
      position:
        type: integer
      value:
        type: string
      visibility:
        $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_repository.PropertyVisibility'
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestPreparationReport:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestPreparationItem'
        type: array
      user:
        $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestUserOption'
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestSummary:
    properties:
      created_at:
        type: string
      item_id:
        type: integer
      item_name:
        type: string
      reason:
        type: string
      status:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestUserOption:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestsPage:
    properties:
      items:
        description: ItemRequest page items
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestSummary'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemType:
    properties:
      derived_name_format:
        maxLength: 255
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      properties:
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemTypeProperty'
        type: array
    required:
    - derived_name_format
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemTypeFilterableProperty:
    properties:
      property_id:
        type: integer
      value_count:
        type: integer
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemTypeOption:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemTypeProperty:
    properties:
      default_value:
        items:
          type: integer
        type: array
      id:
        type: integer
      visibility:
        enum:
        - overview
        - details
        type: string
    required:
    - id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemTypesPage:
    properties:
      items:
        description: ItemType page items
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemType'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.ItemsPage:
    properties:
      items:
        description: Item page items
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.Item'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.PropertiesPage:
    properties:
      items:
        description: Property page items
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.Property'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.Property:
    properties:
      default_value:
        items:
          type: integer
        type: array
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      value_type:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.PropertyOption:
    properties:
      default_value:
        items:
          type: integer
        type: array
      id:
        type: integer
      name:
        type: string
      value_type:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.RegistrationRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.UpdateItemRequest:
    properties:
      consumption:
        enum:
        - not_consumed
        - partially_consumed
        - fully_consumed
        - damaged
        type: string
      id:
        type: integer
      type_id:
        type: integer
    required:
    - id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.UpdateItemTypeRequest:
    properties:
      derived_name_format:
        maxLength: 255
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    required:
    - id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.UpdatePropertyRequest:
    properties:
      default_value:
        items:
          type: integer
        type: array
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    required:
    - id
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.UpdateUserRequest:
    properties:
      role:
        enum:
        - admin
        - manager
        - user
        type: string
      status:
        enum:
        - active
        - requested
        type: string
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.User:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_repository.UserRole'
      status:
        $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_repository.UserStatus'
    type: object
  github_com_studentinovisad_popisomator_backend_internal_dto.UsersPage:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.User'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  github_com_studentinovisad_popisomator_backend_internal_repository.ConsumptionStatus:
    enum:
    - not_consumed
    - partially_consumed
    - fully_consumed
    - damaged
    type: string
    x-enum-varnames:
    - ConsumptionStatusNotConsumed
    - ConsumptionStatusPartiallyConsumed
    - ConsumptionStatusFullyConsumed
    - ConsumptionStatusDamaged
  github_com_studentinovisad_popisomator_backend_internal_repository.PropertyVisibility:
    enum:
    - overview
    - details
    type: string
    x-enum-varnames:
    - PropertyVisibilityOverview
    - PropertyVisibilityDetails
  github_com_studentinovisad_popisomator_backend_internal_repository.RequestStatus:
    enum:
    - requested
    - approved
    type: string
    x-enum-varnames:
    - RequestStatusRequested
    - RequestStatusApproved
  github_com_studentinovisad_popisomator_backend_internal_repository.UserRole:
    enum:
    - admin
    - manager
    - user
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleManager
    - UserRoleUser
  github_com_studentinovisad_popisomator_backend_internal_repository.UserStatus:
    enum:
    - requested
    - active
    type: string
    x-enum-varnames:
    - UserStatusRequested
    - UserStatusActive
  github_com_studentinovisad_popisomator_backend_internal_response.Error:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: Inventory management API for Popisomator.
  title: Popisomator API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Session cookie set
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      summary: Log in and receive a session cookie
      tags:
      - Auth
  /auth/logout:
    post:
      responses:
        "200":
          description: Session cookie cleared
      summary: Log out and clear the session cookie
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.RegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.User'
        "400":
          description: invalid request / validation failed
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "409":
          description: user with this email already exists
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      summary: Self-register a new user account (created with role "user", status
        "requested")
      tags:
      - Auth
  /health:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "503":
          description: database unavailable
          schema:
            type: string
      summary: Readiness probe, verifies database connectivity
      tags:
      - Operational
  /item-requests:
    delete:
      parameters:
      - description: Item request to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestIdentifierRequest'
      responses:
        "200":
          description: OK
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      security:
      - CookieAuth: []
      summary: Delete an item request (manager/admin only)
      tags:
      - ItemRequests
    get:
      parameters:
      - description: Page size (default 20, max 50)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Filter by item request status
        enum:
        - requested
        - approved
        in: query
        name: status
        type: string
      - description: Filter by requester ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestsPage'
        "400":
          description: invalid limit/offset
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      security:
      - CookieAuth: []
      summary: List item requests (manager/admin only)
      tags:
      - ItemRequests
    post:
      consumes:
      - application/json
      parameters:
      - description: Item request to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequest'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      security:
      - CookieAuth: []
      summary: Create an item request (admin only)
      tags:
      - ItemRequests
  /item-requests/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Item request to approve
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestIdentifierRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequest'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      security:
      - CookieAuth: []
      summary: Approve an item request (manager/admin only). Approving an item request
        deletes other unapproved requests for the same item.
      tags:
      - ItemRequests
  /item-requests/me:
    get:
      parameters:
      - description: Page size (default 20, max 50)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestsPage'
        "400":
          description: invalid limit/offset
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      security:
      - CookieAuth: []
      summary: List personal item requests (of logged in user)
      tags:
      - ItemRequests
    post:
      consumes:
      - application/json
      parameters:
      - description: Item request to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestCreatePersonalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequest'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      security:
      - CookieAuth: []
      summary: Create an item request on behalf of logged in user
      tags:
      - ItemRequests
  /item-requests/me/{item_id}:
    get:
      parameters:
      - description: Item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequest'
        "400":
          description: invalid item id
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_response.Error'
      security:
      - CookieAuth: []
      summary: Get personal item request (that the logged in user created) by item
        ID
      tags:
      - ItemRequests
  /item-requests/preparation-report:
    get:
      parameters:
      - description: Requester ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_studentinovisad_popisomator_backend_internal_dto.ItemRequestPreparationReport'
        "400":
